name: CI

on:
  push:
    branches: [main, master, feature/**]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — pytest + import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dinarlytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dinarlytics_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dinarlytics_test
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0123456789
      ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (tesseract for OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: App import check (all routers load)
        run: python -c "from app.main import app; print('routes:', len(app.routes))"

      - name: Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Hierarchy provisioning script runs
        run: python scripts/migrate_company_hierarchy_accounts.py

      - name: Run pytest
        run: pytest tests/ -q

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      # Le typecheck a une dette préexistante (~340 erreurs héritées) :
      # on la borne pour empêcher toute régression sans bloquer sur
      # l'historique. Objectif : faire décroître ce plafond.
      - name: Typecheck (bounded — no new errors allowed)
        run: |
          COUNT=$(npx tsc --noEmit -p tsconfig.json 2>&1 | grep -c "error TS" || true)
          echo "TypeScript errors: $COUNT (budget: 345)"
          if [ "$COUNT" -gt 345 ]; then
            echo "::error::New TypeScript errors introduced ($COUNT > 345)"
            exit 1
          fi

      - name: Production build
        run: npm run build

  docker:
    name: Docker — backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t dinarlytics-backend:ci ./backend
